# Custom keybinding descriptions for vicinae keybindings.sh
# Format: dispatcher:argument=description
# Or just: dispatcher=description (for any argument)
# Lines starting with # are comments

# Example custom descriptions:
# exec:bash ~/.config/vicinae/scripts/battery.sh=󰁹 Show Battery Status
# exec:bash ~/.config/vicinae/scripts/todo.sh=󰓋 Open Todo List
# togglespecialworkspace:ferdium=󱂬 Toggle Ferdium Scratchpad
# togglespecialworkspace:music=󰓃 Toggle Spotify Scratchpad
# movefocus:l=󰁍 Focus Left
# movefocus:r=󰁔 Focus Right
# movefocus:u=󰁝 Focus Up
# movefocus:d=󰁅 Focus Down
# movewindow:l=󰁍 Move Window Left
# movewindow:r=󰁔 Move Window Right
# movewindow:u=󰁝 Move Window Up
# movewindow:d=󰁅 Move Window Down
# workspace:1=󰄰 Workspace 1
# workspace:2=󰄰 Workspace 2
# workspace:3=󰄰 Workspace 3
# workspace:4=󰄰 Workspace 4
# workspace:5=󰄰 Workspace 5
# workspace:6=󰄰 Workspace 6
# workspace:7=󰄰 Workspace 7
# workspace:8=󰄰 Workspace 8
# workspace:9=󰄰 Workspace 9
# workspace:10=󰄰 Workspace 10